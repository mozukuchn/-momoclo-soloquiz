<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e94b91"><title>ももクロQUIZ</title><style>
:root{--pink:#e94b91;--dark:#312333;--soft:#fff0f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff7fb,#ffe5f1);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}.pill{background:#ffe0ef;color:#b82f70;border-radius:99px;padding:7px 12px;font-size:12px}.hero,.card{background:#fff;border:1px solid #f6d5e4;border-radius:22px;padding:24px;box-shadow:0 8px 28px #9c47701a}.hero{text-align:center;margin:28px 0}.eyebrow{color:var(--pink);font-size:12px;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(34px,9vw,54px);margin:10px 0}.hero p,.muted{color:#846d7a;line-height:1.7}.section{margin:26px 0}.section-title{font-weight:900;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#fff;border:1px solid #f3cadd;border-radius:16px;padding:16px;text-align:left;color:var(--dark);font-weight:800;min-height:78px}.tile small{display:block;color:#987d8c;font-weight:500;margin-top:6px}button{font:inherit;cursor:pointer}.primary{background:var(--pink);color:white;border:0;border-radius:14px;padding:14px 22px;font-weight:900;width:100%;margin-top:14px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #edc7da;border-radius:13px;padding:14px;margin:9px 0;color:var(--dark)}.option:disabled{opacity:1}.option.selected{border:2px solid var(--pink);background:var(--soft)}.question{font-size:21px;font-weight:900;line-height:1.6;margin:18px 0}.notice{background:var(--soft);border-radius:12px;padding:12px;font-weight:800}.big{font-size:42px;font-weight:900;color:var(--pink)}a{color:var(--pink);font-weight:800;text-decoration:none}.footer{text-align:center;font-size:12px;color:#9b8792;margin-top:35px}.back{display:inline-block;margin-bottom:14px}
</style></head><body><main class="wrap"><header class="top"><div>🎤 MOMOIRO QUIZ</div><span class="pill">SOLO QUIZ</span></header><div id="app"></div><p class="footer">本サイトはファン制作の非公式クイズ企画です。公式とは関係ありません。</p></main><script>
const questions=[
{id:1,prompt:'「ももいろクローバーZ」のグループ名に含まれるアルファベットは？',options:['A','X','Z','M'],correct:2,level:'初級',member:null},
{id:2,prompt:'メンバーカラーが黄色のメンバーは？',options:['百田夏菜子','玉井詩織','佐々木彩夏','高城れに'],correct:1,level:'初級',member:'玉井詩織'},
{id:3,prompt:'メンバーカラーが紫のメンバーは？',options:['百田夏菜子','玉井詩織','佐々木彩夏','高城れに'],correct:3,level:'初級',member:'高城れに'},
{id:4,prompt:'メンバーカラーが赤のメンバーは？',options:['百田夏菜子','玉井詩織','佐々木彩夏','高城れに'],correct:0,level:'初級',member:'百田夏菜子'},
{id:5,prompt:'メンバーカラーがピンクのメンバーは？',options:['百田夏菜子','玉井詩織','佐々木彩夏','高城れに'],correct:2,level:'初級',member:'佐々木彩夏'}];
const app=document.getElementById('app');let list=[],idx=0,score=0,choice=null;
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">MOMOIRO CHALLENGE</div><h1>ももクロQUIZ</h1><p>ももクロに関するクイズに挑戦！<br>ひとりで気軽に楽しもう。</p><button class="primary" onclick="start()">クイズに挑戦</button></section><section class="section"><div class="section-title">メンバー別クイズ</div><div class="grid">${['百田夏菜子 ❤️','玉井詩織 💛','佐々木彩夏 💗','高城れに 💜'].map(x=>`<button class="tile" onclick="start('member','${x.split(' ')[0]}')">${x}<small>メンバーにまつわる問題</small></button>`).join('')}</div></section><section class="section"><div class="section-title">難易度を選んで挑戦</div><div class="grid">${['初級','中級','上級','超難問'].map(x=>`<button class="tile" onclick="start('level','${x}')">${x}<small>レベルを選んで挑戦</small></button>`).join('')}</div></section>`}
function start(type,val){list=questions.filter(q=>!type||q[type]===val);if(!list.length){app.innerHTML=`<section class="card"><a href="#" onclick="home();return false">← ホーム</a><p>この条件の問題はまだありません。</p></section>`;return}idx=0;score=0;choice=null;showQuestion()}
function showQuestion(){const q=list[idx];app.innerHTML=`<a class="back" href="#" onclick="home();return false">← ホーム</a><section class="card"><p class="muted">第 ${idx+1} 問 / 全 ${list.length} 問 ・ ${q.level}</p><div class="question">${q.prompt}</div>${q.options.map((o,n)=>`<button class="option" ${choice!==null?'disabled':''} onclick="answer(${n})">${'ABCD'[n]}. ${o}</button>`).join('')}<div id="feedback"></div></section>`}
function answer(n){if(choice!==null)return;choice=n;const q=list[idx];if(n===q.correct)score+=100;showQuestion();document.querySelectorAll('.option')[n].classList.add('selected');document.getElementById('feedback').innerHTML=`<p class="notice">${n===q.correct?'正解！ +100 pt':'残念！ 正解は '+q.options[q.correct]}</p><button class="primary" onclick="next()">${idx+1===list.length?'結果を見る':'次の問題へ'}</button>`}
function next(){if(idx+1===list.length){app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR RESULT</div><h1>RESULT</h1><div class="big">${score} pt</div><p>${list.length}問中の結果</p><button class="primary" onclick="home()">ホームへ戻る</button><button class="primary" onclick="start()">もう一度挑戦</button></section>`}else{idx++;choice=null;showQuestion()}}
home();
</script></body></html>
