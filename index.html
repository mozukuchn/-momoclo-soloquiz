const app=document.getElementById('app');let list=[],idx=0,score=0,choice=null,currentType=null,currentVal=null;

// 効果音（外部音源なし・Web Audio APIで生成）
function playTones(notes){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    const now=ctx.currentTime;
    notes.forEach(([freq,start,duration,wave='sine',volume=.16])=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=wave;osc.frequency.setValueAtTime(freq,now+start);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+start);osc.stop(now+start+duration+.02);
    });
    setTimeout(()=>ctx.close(),1200);
  }catch(e){}
}
function soundCorrect(){playTones([[880,0,.13],[1175,.15,.22]]);}
function soundWrong(){playTones([[220,0,.22,'square',.11],[165,.23,.32,'square',.10]]);}
function soundResult(){playTones([[523,0,.16],[659,.14,.16],[784,.28,.16],[1047,.42,.38]]);}

function home(){const members=[{name:'百田夏菜子',icon:'❤️',color:'red',tag:'RED'},{name:'玉井詩織',icon:'💛',color:'yellow',tag:'YELLOW'},{name:'佐々木彩夏',icon:'💗',color:'pink',tag:'PINK'},{name:'高城れに',icon:'💜',color:'purple',tag:'PURPLE'}];const levels=[{name:'初級',icon:'⭐',note:'まずはここから'},{name:'中級',icon:'⭐⭐',note:'少しずつレベルアップ'},{name:'上級',icon:'⭐⭐⭐',note:'知識を試そう'},{name:'Z級',icon:'👑',note:'ファン上級者向け'}];app.innerHTML=`<section class="hero"><div class="hero-sparkle">✦　♡　✦</div><div class="eyebrow">MOMOIRO UNOFFICIAL FAN QUIZ</div><h1>ももクロ<span>QUIZ</span></h1><p>あなたの“好き”をクイズでチェック♡<br>ランダム10問にチャレンジしよう！</p><button class="primary" onclick="start()">クイズに挑戦　♡</button><div class="hero-foot">LET'S ENJOY MOMOCLO TIME ✧</div></section><section class="section"><div class="section-heading"><span class="section-icon">♡</span><div><div class="section-title">メンバー別クイズ</div><div class="section-sub">推しメンの問題にチャレンジ！</div></div></div><div class="grid member-grid">${members.map(m=>`<button class="tile member-tile ${m.color}" onclick="start('member','${m.name}')"><span class="member-tag">${m.tag}</span><span class="member-name">${m.name}</span><span class="member-heart">${m.icon}</span><small>PROFILE & QUIZ　↗</small></button>`).join('')}</div></section><section class="section"><div class="section-heading"><span class="section-icon">✧</span><div><div class="section-title">難易度を選んで挑戦</div><div class="section-sub">今の気分に合わせて選んでね</div></div></div><div class="grid level-grid">${levels.map((l,i)=>`<button class="tile level-tile level-${i}" onclick="start('level','${l.name}')"><span class="level-icon">${l.icon}</span><span class="level-name">${l.name}</span><small>${l.note}</small></button>`).join('')}</div></section><div class="home-note">♡　全問正解を目指してがんばろう！　♡</div>`}
function start(type=currentType,val=currentVal){currentType=type||null;currentVal=type?val:null;const pool=questions.filter(q=>!currentType||q[currentType]===currentVal);if(!pool.length){app.innerHTML=`<section class="card"><a href="#" onclick="home();return false">← ホーム</a><p>この条件の問題はまだありません。</p></section>`;return}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}list=pool.slice(0,10);if(currentType==='member'){const levelOrder={'初級':0,'中級':1,'上級':2,'Z級':3};list.sort((a,b)=>(levelOrder[a.level]??99)-(levelOrder[b.level]??99))}idx=0;score=0;choice=null;showQuestion()}
function showQuestion(){const q=list[idx];const categoryLabel=currentType==='member'?currentVal:q.level;app.innerHTML=`<a class="back" href="#" onclick="home();return false">← ホーム</a><section class="card"><p class="muted">第 ${idx+1} 問 / 全 ${list.length} 問 ・ ${categoryLabel}</p><div class="question">${q.prompt}</div>${q.options.map((o,n)=>`<button class="option" ${choice!==null?'disabled':''} onclick="answer(${n})">${'ABCD'[n]}. ${o}</button>`).join('')}<div id="feedback"></div></section>`}
function answer(n){if(choice!==null)return;choice=n;const q=list[idx];if(n===q.correct){score+=1;soundCorrect()}else{soundWrong()}showQuestion();document.querySelectorAll('.option')[n].classList.add('selected');document.getElementById('feedback').innerHTML=`<p class="notice">${n===q.correct?'正解！ +1 pt':'残念！ 正解は '+q.options[q.correct]}</p><button class="primary" onclick="next()">${idx+1===list.length?'結果を見る':'次の問題へ'}</button>`}
function next(){if(idx+1===list.length){soundResult();app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR RESULT</div><h1>RESULT</h1><div class="big">${score} pt</div><p>${list.length}問中の結果</p><button class="primary" onclick="home()">ホームへ戻る</button><button class="primary" onclick="start(currentType,currentVal)">もう一度挑戦</button></section>`}else{idx++;choice=null;showQuestion()}}

// ボタン操作音（外部音声ファイル不要）
let buttonAudioContext = null;
document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    buttonAudioContext ||= new AudioContextClass();
    if (buttonAudioContext.state === 'suspended') buttonAudioContext.resume();

    const ctx = buttonAudioContext;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(660, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.11);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.12);
  } catch (error) {
    // 効果音が使えない環境でもクイズ本体は動作します
  }
});

home();
</script></body></html>
