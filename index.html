/* 3D floating virtual-world layer */
:root{
  --float-cyan:#74e3fa;
  --float-blue:#35b8eb;
  --float-shadow:rgba(37,139,190,.22);
}
html{perspective:1200px;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse at 50% 110%,rgba(75,192,239,.18),transparent 43%),
    radial-gradient(circle at 12% 8%,rgba(166,239,255,.78),transparent 25%),
    radial-gradient(circle at 92% 18%,rgba(195,231,255,.78),transparent 27%),
    linear-gradient(145deg,#f9fdff 0%,#e9f8ff 52%,#f7fcff 100%);
}
body:before{
  width: min(72vw,620px);height:min(72vw,620px);
  right:-24vw;top:12%;
  border:1px solid rgba(54,184,229,.25);
  box-shadow:0 0 0 22px rgba(255,255,255,.18),0 0 0 48px rgba(63,192,231,.07),0 0 70px rgba(73,199,235,.12);
  animation:orb-drift 14s ease-in-out infinite alternate;
}
body:after{
  width:min(56vw,440px);height:min(56vw,440px);
  left:-20vw;bottom:3%;
  border-color:rgba(54,184,229,.22);
  box-shadow:0 0 0 20px rgba(255,255,255,.2),0 0 0 43px rgba(63,192,231,.07),0 0 65px rgba(73,199,235,.1);
  animation:orb-drift 17s ease-in-out infinite alternate-reverse;
}
.wrap{perspective:1400px;transform-style:preserve-3d}
.top{filter:drop-shadow(0 5px 8px rgba(44,150,190,.12))}
.pill{box-shadow:0 5px 0 rgba(77,171,206,.13),0 12px 25px rgba(58,163,202,.13);transform:translateZ(18px)}
.hero,.card{
  transform-style:preserve-3d;
  box-shadow:0 22px 42px rgba(52,139,183,.17),0 7px 0 rgba(110,203,229,.12),inset 0 0 0 1px rgba(255,255,255,.98);
}
.hero{
  transform:translateZ(24px) rotateX(1.2deg);
  animation:hero-float 7s ease-in-out infinite;
}
.hero:before{
  border-color:rgba(66,188,224,.3);
  box-shadow:inset 0 0 24px rgba(118,222,246,.08);
}
.hero:after{
  transform:translateZ(28px);
  filter:drop-shadow(0 8px 16px rgba(49,169,212,.18));
  animation:orb-spin 22s linear infinite;
}
.hero h1{transform:translateZ(28px);text-shadow:0 2px 0 #fff,0 9px 20px rgba(50,152,193,.13)}
.hero-sparkle,.eyebrow,.hero p,.hero-foot{transform:translateZ(16px)}
.section{transform-style:preserve-3d}
.section-heading{transform:translateZ(15px)}
.section-icon{
  box-shadow:0 7px 0 rgba(74,177,211,.12),0 13px 22px rgba(58,163,202,.17),inset 0 1px 0 white;
  transform:translateZ(22px);
}
.grid{perspective:1000px;transform-style:preserve-3d;gap:17px}
.tile{
  transform:translateZ(16px) rotateX(2deg);
  transform-style:preserve-3d;
  box-shadow:0 11px 0 rgba(89,175,207,.13),0 18px 26px rgba(65,151,183,.16),inset 0 1px 0 #fff;
  animation:tile-hover 6.5s ease-in-out infinite;
}
.tile:nth-child(2n){animation-delay:-2.2s}
.tile:nth-child(3n){animation-delay:-4.1s}
.tile:before{
  width:110px;height:110px;right:-32px;bottom:-51px;
  border-width:2px;opacity:.19;transform:translateZ(14px);
  box-shadow:0 0 0 11px rgba(255,255,255,.3),0 0 0 24px rgba(255,255,255,.2),0 0 25px currentColor;
}
.tile:hover{
  transform:translateY(-8px) translateZ(35px) rotateX(4deg) rotateY(-2deg);
  box-shadow:0 15px 0 rgba(89,175,207,.1),0 28px 34px rgba(43,143,188,.22),inset 0 1px 0 #fff;
}
.tile:active{
  transform:translateY(2px) translateZ(8px) scale(.985);
  box-shadow:0 4px 0 rgba(89,175,207,.12),0 8px 13px rgba(65,151,183,.12);
}
.member-heart{filter:drop-shadow(0 4px 4px rgba(69,151,190,.18));transform:translateZ(22px)}
.level-icon,.level-name,.level-tile small,.member-tag,.member-name,.member-tile small{transform:translateZ(18px)}
.card{animation:card-arrive .5s cubic-bezier(.2,.8,.2,1) both}
.question{transform:translateZ(20px);text-shadow:0 2px 0 white}
.option{
  transform:translateZ(10px);
  box-shadow:0 5px 0 rgba(82,174,208,.12),0 10px 18px rgba(67,151,184,.1),inset 0 1px 0 white;
}
.option.selected{
  transform:translateZ(18px);
  box-shadow:0 7px 0 rgba(54,171,211,.13),0 14px 24px rgba(49,171,211,.17),inset 0 1px 0 white;
}
.primary{
  transform:translateZ(25px);
  box-shadow:0 7px 0 #1685b9,0 15px 28px rgba(38,160,207,.25),inset 0 1px 0 rgba(255,255,255,.7);
}
.primary:active{transform:translateY(4px) translateZ(8px)}
.notice{box-shadow:0 7px 0 rgba(80,175,208,.1),0 12px 20px rgba(67,151,184,.1)}
.footer{transform:translateZ(8px)}
/* subtle virtual-world light particles */
.virtual-particles{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.virtual-particles i{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#fff;box-shadow:0 0 9px 3px rgba(85,210,244,.45);
  animation:particle-rise 12s linear infinite;
}
.virtual-particles i:nth-child(1){left:12%;top:82%;animation-delay:-2s}
.virtual-particles i:nth-child(2){left:82%;top:75%;animation-delay:-7s}
.virtual-particles i:nth-child(3){left:68%;top:35%;animation-delay:-4s}
.virtual-particles i:nth-child(4){left:28%;top:55%;animation-delay:-9s}
.virtual-particles i:nth-child(5){left:91%;top:48%;animation-delay:-5s}
@keyframes hero-float{0%,100%{transform:translateY(0) translateZ(24px) rotateX(1.2deg)}50%{transform:translateY(-7px) translateZ(32px) rotateX(1.2deg)}}
@keyframes tile-hover{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes orb-drift{0%{translate:0 0;scale:1}100%{translate:-16px 18px;scale:1.04}}
@keyframes orb-spin{to{rotate:360deg}}
@keyframes card-arrive{from{opacity:0;transform:translateY(16px) translateZ(-20px) rotateX(5deg)}to{opacity:1;transform:translateY(0) translateZ(0) rotateX(0)}}
@keyframes particle-rise{0%{transform:translate3d(0,30px,0) scale(.5);opacity:0}20%{opacity:.8}80%{opacity:.65}100%{transform:translate3d(25px,-110px,0) scale(1.2);opacity:0}}
@media(max-width:600px){
  .hero{transform:translateZ(12px)}
  .tile{transform:translateZ(10px)}
  .grid{gap:13px}
}
@media(hover:none){
  .tile:hover{transform:translateZ(16px) rotateX(2deg)}
}
@media(prefers-reduced-motion:reduce){
  .hero,.tile,body:before,body:after,.hero:after,.virtual-particles i{animation:none!important}
  .card{animation:none!important}
}


/* 出題中は背景・カード・装飾をすべて静止 */
body:has(.question):before,
body:has(.question):after,
body:has(.question) .virtual-particles i,
body:has(.question) .hero,
body:has(.question) .hero:after,
body:has(.question) .tile,
body:has(.question) .card {
  animation: none !important;
}
body:has(.question) .hero,
body:has(.question) .tile,
body:has(.question) .card,
body:has(.question) .question,
body:has(.question) .option,
body:has(.question) .option.selected,
body:has(.question) .footer {
  transform: none !important;
  translate: none !important;
}
body:has(.question) .virtual-particles {
  visibility: hidden;
}
body:has(.question) .option,
body:has(.question) .option:active {
  transition: none !important;
}


/* 回答後の正解・不正解を明確に表示 */
.option.correct-answer {
  border: 2px solid #16a765 !important;
  color: #126b43 !important;
  background: linear-gradient(110deg,#d9fbe9,#effff5) !important;
  box-shadow: 0 0 0 4px rgba(22,167,101,.16), 0 7px 18px rgba(22,167,101,.14) !important;
  font-weight: 900;
}
.option.correct-answer:after {
  content: " ✓ 正解";
  float: right;
  color: #11834f;
  font-weight: 1000;
}
.option.wrong-answer {
  border: 2px solid #e05262 !important;
  color: #a82b3b !important;
  background: linear-gradient(110deg,#ffe1e4,#fff2f3) !important;
  box-shadow: 0 0 0 4px rgba(224,82,98,.15), 0 7px 18px rgba(224,82,98,.13) !important;
  font-weight: 900;
}
.option.wrong-answer:after {
  content: " × 選んだ答え";
  float: right;
  color: #c43b4b;
  font-weight: 900;
}
.answer-result {
  display:flex;
  align-items:center;
  gap:14px;
  margin:18px 0 14px;
  padding:16px;
  border-radius:19px;
  border:2px solid;
  box-shadow:0 8px 22px rgba(45,100,125,.12);
}
.answer-result.is-correct {
  color:#126b43;
  border-color:#20b875;
  background:linear-gradient(120deg,#d8fbe9,#f2fff7);
}
.answer-result.is-wrong {
  color:#a82b3b;
  border-color:#e05262;
  background:linear-gradient(120deg,#ffe0e4,#fff5f5);
}
.answer-icon {
  flex:0 0 48px;
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:50%;
  color:white;
  font-size:30px;font-weight:1000;
  background:#16a765;
  box-shadow:0 4px 0 rgba(0,0,0,.1);
}
.is-wrong .answer-icon { background:#df4e60; }
.answer-title { font-size:22px;font-weight:1000;letter-spacing:.04em; }
.answer-detail { margin-top:3px;font-size:14px;font-weight:900; }


.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;margin:0 -4px 14px;border:1px solid rgba(67,178,214,.24);border-radius:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{white-space:nowrap}.top-nav{display:flex;align-items:center;gap:6px}.nav-item{padding:9px 13px;border:1px solid rgba(67,178,214,.32);border-radius:999px;background:rgba(255,255,255,.82);color:#258bb7;font-size:12px;font-weight:900;letter-spacing:.04em;white-space:nowrap;box-shadow:0 3px 9px rgba(58,163,202,.08)}.nav-item:active{transform:translateY(1px)}

/* 解答履歴はBGM設定と同じ見出しデザインの折りたたみ */
.history-accordion{margin:0 0 4px;border:1px solid rgba(67,178,214,.22);border-radius:16px;background:linear-gradient(120deg,rgba(235,250,255,.48),rgba(255,255,255,.8));overflow:hidden}
.history-toggle{list-style:none;display:flex;align-items:center;gap:12px;margin:0;padding:12px 14px;cursor:pointer;user-select:none}
.history-toggle::-webkit-details-marker{display:none}
.history-heading-copy{display:flex;flex-direction:column;min-width:0}
.history-chevron{margin-left:auto;color:#299bc5;font-size:22px;font-weight:900;transition:transform .2s ease}
.history-accordion[open] .history-chevron{transform:rotate(180deg)}
.history-list{padding:0 14px 10px}
.history-entry{padding:13px 0;border-top:1px solid rgba(95,181,211,.22)}
.history-entry>summary{cursor:pointer;color:#285b79;font-weight:900;line-height:1.6}

const bgmPlayer=document.getElementById("bgm-player");
// BGM：最初のタップ後に再生（スマートフォンの自動再生制限に対応）

// オリジナルBGM：きらきらしたベル音＋明るいコード＋軽いドラムのキュートポップ
const bgmToggle=document.getElementById('bgm-toggle');
const bgmVolume=document.getElementById('bgm-volume');
let bgmCtx=null, bgmMaster=null, bgmTimer=null, bgmStep=0, bgmPlaying=false;
const bpm=120, stepMs=60000/bpm/4;
const melody=[
  76,null,79,null,81,null,79,76, 72,null,74,null,76,null,79,null,
  81,null,84,null,83,null,81,79, 76,null,79,null,76,null,74,null,
  76,null,79,null,84,null,83,79, 81,null,79,null,76,null,74,null,
  72,null,76,null,79,null,76,74, 72,null,74,null,76,null,72,null
];
const chordNotes=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
const bassNotes=[36,31,33,29];

function midiHz(n){return 440*Math.pow(2,(n-69)/12);}
function tone(freq,when,duration,wave='sine',volume=.12,attack=.012,release=.12){
  const osc=bgmCtx.createOscillator(), gain=bgmCtx.createGain();
  osc.type=wave; osc.frequency.setValueAtTime(freq,when);
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.linearRampToValueAtTime(volume,when+attack);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration+release);
  osc.connect(gain); gain.connect(bgmMaster);
  osc.start(when); osc.stop(when+duration+release+.03);
}
function kick(when){
  const osc=bgmCtx.createOscillator(), gain=bgmCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(125,when);
  osc.frequency.exponentialRampToValueAtTime(48,when+.14);
  gain.gain.setValueAtTime(.22,when); gain.gain.exponentialRampToValueAtTime(.0001,when+.16);
  osc.connect(gain); gain.connect(bgmMaster); osc.start(when); osc.stop(when+.18);
}
function hat(when,vol=.025){
  const length=Math.floor(bgmCtx.sampleRate*.045);
  const buffer=bgmCtx.createBuffer(1,length,bgmCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*(1-i/length);
  const noise=bgmCtx.createBufferSource(), filter=bgmCtx.createBiquadFilter(), gain=bgmCtx.createGain();
  noise.buffer=buffer; filter.type='highpass'; filter.frequency.value=6500;
  gain.gain.setValueAtTime(vol,when); gain.gain.exponentialRampToValueAtTime(.0001,when+.045);
  noise.connect(filter); filter.connect(gain); gain.connect(bgmMaster); noise.start(when);
}
function snare(when){
  hat(when,.055);
  tone(185,when,.045,'triangle',.035,.002,.06);
}
function playStep(){
  if(!bgmPlaying || !bgmCtx) return;
  const now=bgmCtx.currentTime+.025;
  const step=bgmStep%64, bar=Math.floor(step/16), pos=step%16;
  const note=melody[step];
  if(note!==null){
    tone(midiHz(note),now,.12,'triangle',.095,.008,.18);
    tone(midiHz(note+12),now,.07,'sine',.025,.006,.12);
  }
  if(pos===0){
    chordNotes[bar].forEach((n,i)=>tone(midiHz(n),now,.72,'sine',.035,.08,.25));
    tone(midiHz(bassNotes[bar]),now,.28,'triangle',.09,.015,.13);
    kick(now);
  }else if(pos===8){
    tone(midiHz(bassNotes[bar]),now,.22,'triangle',.075,.01,.1);
    kick(now);
  }
  if(pos===4 || pos===12) snare(now);
  if(pos%2===0) hat(now,.018);
  bgmStep=(bgmStep+1)%64;
}
function updateBgmButton(){
  bgmToggle.textContent=bgmPlaying?'♫ BGM ON':'♫ BGM OFF';
  bgmToggle.classList.toggle('is-on',bgmPlaying);
  bgmToggle.setAttribute('aria-pressed',String(bgmPlaying));
}
async function toggleBgm(){
  try{
    if(!bgmCtx){
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioContextClass) throw new Error('Web Audio unavailable');
      bgmCtx=new AudioContextClass();
      bgmMaster=bgmCtx.createGain();
      bgmMaster.gain.value=Number(bgmVolume.value);
      bgmMaster.connect(bgmCtx.destination);
    }
    if(bgmPlaying){
      bgmPlaying=false;
      clearInterval(bgmTimer);
      bgmTimer=null;
    }else{
      await bgmCtx.resume();
      bgmPlaying=true;
      playStep();
      bgmTimer=setInterval(playStep,stepMs);
    }
    updateBgmButton();
  }catch(error){
    bgmToggle.textContent='音声を再生できません';
    bgmToggle.classList.remove('is-on');
  }
}
bgmVolume.addEventListener('input',()=>{
  if(bgmMaster && bgmCtx) bgmMaster.gain.setTargetAtTime(Number(bgmVolume.value),bgmCtx.currentTime,.025);

// 効果音（外部音源なし・Web Audio APIで生成）
function playTones(notes){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    const now=ctx.currentTime;
    notes.forEach(([freq,start,duration,wave='sine',volume=.16])=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=wave;osc.frequency.setValueAtTime(freq,now+start);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+start);osc.stop(now+start+duration+.02);
    });
    setTimeout(()=>ctx.close(),1200);
  }catch(e){}
}

  },{once:true});

  });
}
function normalizeIntroAnswer(value){
  let normalized=String(value||'').normalize('NFKC').toLowerCase()
    .replace(/[\\s　]/g,'')
    .replace(/[\\p{P}\\p{S}]/gu,'');
  // カタカナをひらがなに統一（漢字の読み別名と比較できるようにする）
  normalized=Array.from(normalized).map(ch=>{
    const code=ch.codePointAt(0);
    return code>=0x30A1&&code<=0x30F6?String.fromCodePoint(code-0x60):ch;
  }).join('');
  // Z ver. / ZZ ver. は末尾の ver. のみ任意。Z と ZZ は区別する
  normalized=normalized.replace(/(z{1,2})ver$/,'$1');
  return normalized;
}

function start(type=null,val=null,avoidPrevious=false){currentType=type||null;currentVal=type?val:null;const allPool=questions.filter(q=>!currentType||q[currentType]===currentVal);const previousKey=(currentType||'all')+'::'+String(currentVal??'');const previousIds=lastRunKey===previousKey?lastRunIds:[];const freshPool=avoidPrevious?allPool.filter(q=>!previousIds.includes(q.id)):allPool;const pool=freshPool.length?freshPool:allPool;if(!pool.length){app.innerHTML=`<section class="card"><a href="#" onclick="home();return false">← ホーム</a><p>この条件の問題はまだありません。</p></section>`;return}const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};if(!currentType){const stages=[['初級',3],['中級',3],['上級',2],['Z級',2]];list=stages.flatMap(([level,count])=>shuffle(pool.filter(q=>q.level===level)).slice(0,count));if(list.length<10){const used=new Set(list);list.push(...shuffle(pool.filter(q=>!used.has(q))).slice(0,10-list.length))}}else{list=shuffle(pool).slice(0,10)}// 出題ごとに正解位置をランダム化し、A〜Dにできるだけ均等に配分する
list=list.map(q=>({...q,options:[...q.options]}));
const answerPositions=list.map((_,i)=>i%4);
for(let i=answerPositions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[answerPositions[i],answerPositions[j]]=[answerPositions[j],answerPositions[i]]}
list.forEach((q,i)=>{const answer=q.options[q.correct];const distractors=q.options.filter((_,n)=>n!==q.correct);for(let j=distractors.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[distractors[j],distractors[k]]=[distractors[k],distractors[j]]}q.correct=answerPositions[i];distractors.splice(q.correct,0,answer);q.options=distractors});
if(currentType==='member'){const levelOrder={'初級':0,'中級':1,'上級':2,'Z級':3};list.sort((a,b)=>(levelOrder[a.level]??99)-(levelOrder[b.level]??99))}lastRunKey=previousKey;lastRunIds=list.map(q=>q.id);idx=0;score=0;choice=null;runAnswers=[];showQuestion()}

function updateTimeAttackClock(){if(!timeAttackActive)return;const remainMs=Math.max(0,timeAttackEnd-Date.now());const centiseconds=Math.ceil(remainMs/10);const minutes=Math.floor(centiseconds/6000);const seconds=Math.floor((centiseconds%6000)/100);const hundredths=centiseconds%100;const el=document.getElementById('time-attack-clock');if(el)el.textContent=String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+'.'+String(hundredths).padStart(2,'0');if(remainMs<=0)finishTimeAttack()}
function finishTimeAttack(){if(!timeAttackActive)return;timeAttackActive=false;stopTimeAttack();const answered=timeAttackAnswered;const accuracy=answered?Math.round(score/answered*100):0;const record={date:new Date().toISOString(),label:'早押しタイムアタック',score,total:answered,answers:runAnswers.slice()};const history=[record,...readHistory()].slice(0,10);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){}app.innerHTML=`<section class="hero"><div class="eyebrow">TIME ATTACK RESULT</div><h1>TIME UP!</h1><div class="big">${score} pt</div><p>${answered}問回答・正解率 ${accuracy}%</p><p>60秒間で ${answered} 問に挑戦！</p><button class="primary" onclick="home()">ホームへ戻る</button><button class="primary" onclick="startTimeAttack()">もう一度挑戦</button></section>`}

// ボタン操作音（外部音声ファイル不要）
let buttonAudioContext = null;
document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    buttonAudioContext ||= new AudioContextClass();
    if (buttonAudioContext.state === 'suspended') buttonAudioContext.resume();

    const ctx = buttonAudioContext;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(660, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.11);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.12);
  } catch (error) {
    // 効果音が使えない環境でもクイズ本体は動作します
  }
});

  stopTimeAttack();timeAttackActive=false;
  const profile=mpProfile();
  app.innerHTML=`<a class="back" href="#" onclick="home();return false">← ホーム</a><section class="card"><div class="eyebrow">REALTIME BATTLE</div><h2 style="text-align:center;color:#285b79">👥 マルチ対戦</h2><p class="muted" style="text-align:center">ルームを作って友達と同じ10問に挑戦しよう！</p>${!profile?`<div class="notice">先にホーム画面の「ユーザー登録」でニックネームを登録してね。</div><button class="primary" onclick="home()">ホームへ戻る</button>`:`<div class="notice">参加名：${mpEscape(profile.name)}　／　ID：${mpEscape(profile.id)}</div><button class="primary" onclick="createMultiplayerRoom()">＋ ルームを作成</button><div style="margin:22px 0 8px;font-weight:900;color:#32647e">ルームIDで参加</div><input id="mp-room-input" inputmode="numeric" maxlength="6" placeholder="6桁のルームID" style="width:100%;padding:15px;border:1px solid #b9dfee;border-radius:14px;font:inherit;text-align:center;letter-spacing:5px"><button class="primary" onclick="joinMultiplayerRoom()">ルームに参加</button><p id="mp-message" class="muted" role="status"></p>`}</section>`;
}
async function mpEnsureAuth(){if(!mpDb||!mpAuth){throw new Error('Firebase SDKを読み込めません。通信環境を確認してね。');}const ok=await mpAuthReady;if(!ok||!mpUid)throw new Error('匿名ログインできません。Firebase Authenticationの匿名ログイン設定を確認してね。');}
async function createMultiplayerRoom(){
  try{await mpEnsureAuth();const profile=mpProfile();if(!profile)throw new Error('先にニックネームを登録してね。');
    let id='',ref=null;for(let i=0;i<8;i++){id=String(Math.floor(100000+Math.random()*900000));ref=mpDb.ref('rooms/'+id);const snap=await ref.once('value');if(!snap.exists())break;ref=null;}if(!ref)throw new Error('ルームを作成できませんでした。もう一度試してね。');
    const player={name:profile.name,publicId:profile.id,score:0,answer:null,answeredQuestion:-1};
    await ref.set({hostUid:mpUid,status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP,questionIndex:0,questions:null,players:{[mpUid]:player}});
    mpRoomRef=ref;mpRoomId=id;ref.child('players/'+mpUid).onDisconnect().remove();mpListenRoom();
  }catch(e){console.error(e);alert(e.message||'ルーム作成に失敗しました。');}
}
async function joinMultiplayerRoom(){
  try{await mpEnsureAuth();const profile=mpProfile();if(!profile)throw new Error('先にニックネームを登録してね。');const id=(document.getElementById('mp-room-input')?.value||'').replace(/\D/g,'');if(!/^\d{6}$/.test(id))throw new Error('6桁のルームIDを入力してね。');const ref=mpDb.ref('rooms/'+id);const snap=await ref.once('value');if(!snap.exists())throw new Error('そのルームは見つかりません。IDを確認してね。');const room=snap.val();if(room.status!=='waiting')throw new Error('このルームはすでに対戦中です。');if(Object.keys(room.players||{}).length>=8)throw new Error('このルームは満員です（最大8人）。');await ref.child('players/'+mpUid).set({name:profile.name,publicId:profile.id,score:0,answer:null,answeredQuestion:-1});mpRoomRef=ref;mpRoomId=id;ref.child('players/'+mpUid).onDisconnect().remove();mpListenRoom();
  }catch(e){console.error(e);mpMessage(e.message||'参加できませんでした。');}
}
function mpListenRoom(){if(!mpRoomRef)return;if(mpRoomListener)mpRoomRef.off('value',mpRoomListener);mpRoomListener=snap=>{if(!snap.exists()){mpDetach();showMultiplayer();mpMessage('ルームが終了しました。');return;}mpRenderRoom(snap.val());};mpRoomRef.on('value',mpRoomListener,err=>{console.error(err);mpMessage('データを読み込めません。Databaseルールを確認してね。');});}
function mpRenderRoom(room){
  const players=room.players||{};const entries=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));const me=players[mpUid];if(!me){mpDetach();showMultiplayer();mpMessage('ルームから退出しました。');return;}
  const host=room.hostUid===mpUid;const roster=entries.map(([uid,p],i)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #e3f1f6"><span>${i+1}. ${mpEscape(p.name||'プレイヤー')}${uid===room.hostUid?' 👑':''}${uid===mpUid?'（あなた）':''}</span><b>${p.score||0} pt</b></div>`).join('');
  let body='';
  if(room.status==='waiting')body=`<div class="notice">対戦待機中</div><p style="text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;color:#299bc5">${mpRoomId}</p><p class="muted" style="text-align:center">この6桁のIDを友達に共有してね（最大8人）</p><div>${roster}</div>${host?'<button class="primary" onclick="mpStartBattle()">対戦スタート（10問）</button>':'<p class="muted" style="text-align:center">ホストが開始するまで待ってね。</p>'}`;
  else if(room.status==='playing'){
    const q=room.questions?.[room.questionIndex];if(!q){body='<p>問題を読み込んでいます…</p>';}
    else{const answered=me.answeredQuestion===room.questionIndex;const allAnswered=entries.length>0&&entries.every(([,p])=>p.answeredQuestion===room.questionIndex);body=`<p class="muted">第 ${room.questionIndex+1} 問 / 全 ${room.questions.length} 問</p><div class="question">${mpEscape(q.prompt)}</div>${answered?`<div class="notice">回答済み！ほかのプレイヤーの回答を待っています。</div>`:q.options.map((o,i)=>`<button class="option" onclick="mpAnswer(${i})">${'ABCD'[i]}. ${mpEscape(o)}</button>`).join('')}<div style="margin-top:16px">${roster}</div>${host?(allAnswered?'<button class="primary" onclick="mpNextQuestion()">次の問題へ</button>':'<p class="muted">全員の回答がそろうと次へ進めます。</p>'):''}`;}
  } else if(room.status==='finished')body=`<div class="notice">対戦終了！おつかれさま！</div><div style="margin-top:12px">${entries.map(([uid,p],i)=>`<div style="display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid #e3f1f6"><b>${i===0?'🏆 ':''}${i+1}位　${mpEscape(p.name||'プレイヤー')}</b><b>${p.score||0} pt</b></div>`).join('')}</div><button class="primary" onclick="mpLeaveRoom()">対戦を終了して戻る</button>`;
  app.innerHTML=`<a class="back" href="#" onclick="mpLeaveRoom();return false">← 退出</a><section class="card"><div class="eyebrow">ROOM ${mpRoomId||''}</div><h2 style="text-align:center;color:#285b79">マルチ対戦</h2>${body}</section>`;
}
async function mpStartBattle(){try{if(!mpRoomRef||!mpUid)throw new Error('ルームに接続していません。');const snap=await mpRoomRef.once('value');const room=snap.val();if(room.hostUid!==mpUid||room.status!=='waiting')return;await mpRoomRef.update({status:'playing',questions:mpPrepareQuestions(),questionIndex:0});}catch(e){alert(e.message||'開始できませんでした。');}}
async function mpAnswer(index){try{if(!mpRoomRef)return;const snap=await mpRoomRef.once('value');const room=snap.val();if(!room||room.status!=='playing')return;const qi=room.questionIndex;const q=room.questions[qi];const playerRef=mpRoomRef.child('players/'+mpUid);await playerRef.transaction(p=>{if(!p||p.answeredQuestion===qi)return p;const correct=index===q.correct;return {...p,score:(p.score||0)+(correct?1:0),answer:index,answeredQuestion:qi};});}catch(e){console.error(e);mpMessage('回答を送信できませんでした。');}}
async function mpNextQuestion(){try{if(!mpRoomRef)return;const snap=await mpRoomRef.once('value');const room=snap.val();if(!room||room.hostUid!==mpUid||room.status!=='playing')return;const players=Object.values(room.players||{});if(!players.length||!players.every(p=>p.answeredQuestion===room.questionIndex)){alert('まだ回答していない人がいます。');return;}if(room.questionIndex+1>=room.questions.length)await mpRoomRef.update({status:'finished'});else await mpRoomRef.update({questionIndex:room.questionIndex+1});}catch(e){console.error(e);}}
async function mpLeaveRoom(){const ref=mpRoomRef;const uid=mpUid;mpDetach();try{if(ref&&uid)await ref.child('players/'+uid).remove();}catch(e){console.error(e);}showMultiplayer();}

showPortal();

updateUserTop();
</script></body></html>
