<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#effaff"><title>ももクロQUIZ</title><style>

.tile{position:relative;overflow:hidden;min-height:108px;padding:16px 15px;border:1px solid rgba(104,193,221,.36);border-radius:21px;text-align:left;color:#32647e;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(235,250,255,.88));box-shadow:0 6px 18px rgba(65,151,183,.1),inset 0 0 0 1px rgba(255,255,255,.9);transition:transform .18s,box-shadow .18s,border-color .18s}.tile:before{content:"";position:absolute;width:88px;height:88px;right:-27px;bottom:-39px;border-radius:50%;border:1px solid currentColor;opacity:.15;box-shadow:0 0 0 10px rgba(255,255,255,.28),0 0 0 22px rgba(255,255,255,.2)}.tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(65,151,183,.15)}.tile:active{transform:scale(.985)}.member-tile{display:flex;flex-direction:column;justify-content:center;gap:5px}.member-tag{font-size:9px;letter-spacing:2px;font-weight:900;opacity:.72}.member-name{font-size:16px;font-weight:900;white-space:nowrap}.member-heart{position:absolute;right:14px;top:14px;font-size:23px}.member-tile small{margin-top:4px;color:#85a4b4;font-size:9px;letter-spacing:.7px}.member-tile.red{color:#d75e72;background:linear-gradient(140deg,#fff,#fff2f3);border-color:#f1cbd1}.member-tile.yellow{color:#b98b27;background:linear-gradient(140deg,#fff,#fff9e9);border-color:#f0e2b9}.member-tile.pink{color:#d86d9f;background:linear-gradient(140deg,#fff,#fff1f7);border-color:#f2d0e0}.member-tile.purple{color:#8d78c5;background:linear-gradient(140deg,#fff,#f5f1ff);border-color:#ddd5f3}
.level-tile{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:101px}.level-icon{font-size:18px;letter-spacing:2px}.level-name{color:#32647e;font-size:17px;font-weight:900}.level-tile small{color:#86a6b7;font-size:10px}.level-0{background:linear-gradient(145deg,#fff,#fff9e9);border-color:#f0e1b7}.level-1{background:linear-gradient(145deg,#fff,#eefaff);border-color:#bce8f5}.level-2{background:linear-gradient(145deg,#fff,#f2f1ff);border-color:#d7d2f4}.level-3{background:linear-gradient(145deg,#fff,#fff0f4);border-color:#f0cbd7}.home-note{text-align:center;margin:30px 0 4px;color:#79adc2;font-size:11px;letter-spacing:.7px}
.card{margin-top:12px;padding:23px 19px 20px}.back{display:inline-block;margin:0 0 14px;color:#299bc5;font-size:13px;font-weight:900;text-decoration:none}.question{margin:20px 0;color:#285b79;font-size:clamp(19px,5vw,23px);font-weight:900;line-height:1.7}.option{display:block;position:relative;width:100%;min-height:54px;margin:10px 0;padding:14px 15px;border:1px solid rgba(95,181,211,.36);border-radius:15px;text-align:left;color:#355f76;background:linear-gradient(100deg,#fff,#f1fbff);box-shadow:0 4px 12px rgba(67,151,184,.08);transition:transform .14s,border-color .14s,background .14s}.option:active{transform:scale(.99)}.option:disabled{opacity:1}.option.selected{border:2px solid #39b8df;background:linear-gradient(100deg,#e5f9ff,#f5fdff);box-shadow:0 0 0 3px rgba(57,184,223,.12)}.notice{padding:13px;border:1px solid #b9e8f4;border-radius:15px;color:#267b9e;background:linear-gradient(100deg,#e8faff,#f7fdff);font-weight:900}.big{color:#259fce;font-size:clamp(48px,13vw,66px);font-weight:1000;text-shadow:0 3px 0 #fff}a{color:#299bc5;font-weight:900;text-decoration:none}.footer{margin-top:36px;color:#91adbb;text-align:center;font-size:11px;line-height:1.7}
@media(max-width:420px){.wrap{padding:14px 12px 36px}.hero{padding:31px 16px 24px}.card{padding:19px 14px}.tile{min-height:98px;padding:14px 12px}.member-name{font-size:14px}.member-heart{right:11px;top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* 3D floating virtual-world layer */
:root{
  --float-cyan:#74e3fa;
  --float-blue:#35b8eb;
  --float-shadow:rgba(37,139,190,.22);
}
html{perspective:1200px;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse at 50% 110%,rgba(75,192,239,.18),transparent 43%),
    radial-gradient(circle at 12% 8%,rgba(166,239,255,.78),transparent 25%),
    radial-gradient(circle at 92% 18%,rgba(195,231,255,.78),transparent 27%),
    linear-gradient(145deg,#f9fdff 0%,#e9f8ff 52%,#f7fcff 100%);
}
body:before{
  width: min(72vw,620px);height:min(72vw,620px);
  right:-24vw;top:12%;
  border:1px solid rgba(54,184,229,.25);
  box-shadow:0 0 0 22px rgba(255,255,255,.18),0 0 0 48px rgba(63,192,231,.07),0 0 70px rgba(73,199,235,.12);
  animation:orb-drift 14s ease-in-out infinite alternate;
}
body:after{
  width:min(56vw,440px);height:min(56vw,440px);
  left:-20vw;bottom:3%;
  border-color:rgba(54,184,229,.22);
  box-shadow:0 0 0 20px rgba(255,255,255,.2),0 0 0 43px rgba(63,192,231,.07),0 0 65px rgba(73,199,235,.1);
  animation:orb-drift 17s ease-in-out infinite alternate-reverse;
}
.wrap{perspective:1400px;transform-style:preserve-3d}
.top{filter:drop-shadow(0 5px 8px rgba(44,150,190,.12))}
.pill{box-shadow:0 5px 0 rgba(77,171,206,.13),0 12px 25px rgba(58,163,202,.13);transform:translateZ(18px)}
.hero,.card{
  transform-style:preserve-3d;
  box-shadow:0 22px 42px rgba(52,139,183,.17),0 7px 0 rgba(110,203,229,.12),inset 0 0 0 1px rgba(255,255,255,.98);
}
.hero{
  transform:translateZ(24px) rotateX(1.2deg);
  animation:hero-float 7s ease-in-out infinite;
}
.hero:before{
  border-color:rgba(66,188,224,.3);
  box-shadow:inset 0 0 24px rgba(118,222,246,.08);
}
.hero:after{
  transform:translateZ(28px);
  filter:drop-shadow(0 8px 16px rgba(49,169,212,.18));
  animation:orb-spin 22s linear infinite;
}
.hero h1{transform:translateZ(28px);text-shadow:0 2px 0 #fff,0 9px 20px rgba(50,152,193,.13)}
.hero-sparkle,.eyebrow,.hero p,.hero-foot{transform:translateZ(16px)}
.section{transform-style:preserve-3d}
.section-heading{transform:translateZ(15px)}
.section-icon{
  box-shadow:0 7px 0 rgba(74,177,211,.12),0 13px 22px rgba(58,163,202,.17),inset 0 1px 0 white;
  transform:translateZ(22px);
}
.grid{perspective:1000px;transform-style:preserve-3d;gap:17px}
.tile{
  transform:translateZ(16px) rotateX(2deg);
  transform-style:preserve-3d;
  box-shadow:0 11px 0 rgba(89,175,207,.13),0 18px 26px rgba(65,151,183,.16),inset 0 1px 0 #fff;
  animation:tile-hover 6.5s ease-in-out infinite;
}
.tile:nth-child(2n){animation-delay:-2.2s}
.tile:nth-child(3n){animation-delay:-4.1s}
.tile:before{
  width:110px;height:110px;right:-32px;bottom:-51px;
  border-width:2px;opacity:.19;transform:translateZ(14px);
  box-shadow:0 0 0 11px rgba(255,255,255,.3),0 0 0 24px rgba(255,255,255,.2),0 0 25px currentColor;
}
.tile:hover{
  transform:translateY(-8px) translateZ(35px) rotateX(4deg) rotateY(-2deg);
  box-shadow:0 15px 0 rgba(89,175,207,.1),0 28px 34px rgba(43,143,188,.22),inset 0 1px 0 #fff;
}
.tile:active{
  transform:translateY(2px) translateZ(8px) scale(.985);
  box-shadow:0 4px 0 rgba(89,175,207,.12),0 8px 13px rgba(65,151,183,.12);
}
.member-heart{filter:drop-shadow(0 4px 4px rgba(69,151,190,.18));transform:translateZ(22px)}
.level-icon,.level-name,.level-tile small,.member-tag,.member-name,.member-tile small{transform:translateZ(18px)}
.card{animation:card-arrive .5s cubic-bezier(.2,.8,.2,1) both}
.question{transform:translateZ(20px);text-shadow:0 2px 0 white}
.option{
  transform:translateZ(10px);
  box-shadow:0 5px 0 rgba(82,174,208,.12),0 10px 18px rgba(67,151,184,.1),inset 0 1px 0 white;
}
.option.selected{
  transform:translateZ(18px);
  box-shadow:0 7px 0 rgba(54,171,211,.13),0 14px 24px rgba(49,171,211,.17),inset 0 1px 0 white;
}
.primary{
  transform:translateZ(25px);
  box-shadow:0 7px 0 #1685b9,0 15px 28px rgba(38,160,207,.25),inset 0 1px 0 rgba(255,255,255,.7);
}
.primary:active{transform:translateY(4px) translateZ(8px)}
.notice{box-shadow:0 7px 0 rgba(80,175,208,.1),0 12px 20px rgba(67,151,184,.1)}
.footer{transform:translateZ(8px)}
/* subtle virtual-world light particles */
.virtual-particles{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.virtual-particles i{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#fff;box-shadow:0 0 9px 3px rgba(85,210,244,.45);
  animation:particle-rise 12s linear infinite;
}
.virtual-particles i:nth-child(1){left:12%;top:82%;animation-delay:-2s}
.virtual-particles i:nth-child(2){left:82%;top:75%;animation-delay:-7s}
.virtual-particles i:nth-child(3){left:68%;top:35%;animation-delay:-4s}
.virtual-particles i:nth-child(4){left:28%;top:55%;animation-delay:-9s}
.virtual-particles i:nth-child(5){left:91%;top:48%;animation-delay:-5s}
@keyframes hero-float{0%,100%{transform:translateY(0) translateZ(24px) rotateX(1.2deg)}50%{transform:translateY(-7px) translateZ(32px) rotateX(1.2deg)}}
@keyframes tile-hover{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes orb-drift{0%{translate:0 0;scale:1}100%{translate:-16px 18px;scale:1.04}}
@keyframes orb-spin{to{rotate:360deg}}
@keyframes card-arrive{from{opacity:0;transform:translateY(16px) translateZ(-20px) rotateX(5deg)}to{opacity:1;transform:translateY(0) translateZ(0) rotateX(0)}}
@keyframes particle-rise{0%{transform:translate3d(0,30px,0) scale(.5);opacity:0}20%{opacity:.8}80%{opacity:.65}100%{transform:translate3d(25px,-110px,0) scale(1.2);opacity:0}}
@media(max-width:600px){
  .hero{transform:translateZ(12px)}
  .tile{transform:translateZ(10px)}
  .grid{gap:13px}
}
@media(hover:none){
  .tile:hover{transform:translateZ(16px) rotateX(2deg)}
}
@media(prefers-reduced-motion:reduce){
  .hero,.tile,body:before,body:after,.hero:after,.virtual-particles i{animation:none!important}
  .card{animation:none!important}
}


/* 出題中は背景・カード・装飾をすべて静止 */
body:has(.question):before,
body:has(.question):after,
body:has(.question) .virtual-particles i,
body:has(.question) .hero,
body:has(.question) .hero:after,
body:has(.question) .tile,
body:has(.question) .card {
  animation: none !important;
}
body:has(.question) .hero,
body:has(.question) .tile,
body:has(.question) .card,
body:has(.question) .question,
body:has(.question) .option,
body:has(.question) .option.selected,
body:has(.question) .footer {
  transform: none !important;
  translate: none !important;
}
body:has(.question) .virtual-particles {
  visibility: hidden;
}
body:has(.question) .option,
body:has(.question) .option:active {
  transition: none !important;
}


/* 回答後の正解・不正解を明確に表示 */
.option.correct-answer {
  border: 2px solid #16a765 !important;
  color: #126b43 !important;
  background: linear-gradient(110deg,#d9fbe9,#effff5) !important;
  box-shadow: 0 0 0 4px rgba(22,167,101,.16), 0 7px 18px rgba(22,167,101,.14) !important;
  font-weight: 900;
}
.option.correct-answer:after {
  content: " ✓ 正解";
  float: right;
  color: #11834f;
  font-weight: 1000;
}
.option.wrong-answer {
  border: 2px solid #e05262 !important;
  color: #a82b3b !important;
  background: linear-gradient(110deg,#ffe1e4,#fff2f3) !important;
  box-shadow: 0 0 0 4px rgba(224,82,98,.15), 0 7px 18px rgba(224,82,98,.13) !important;
  font-weight: 900;
}
.option.wrong-answer:after {
  content: " × 選んだ答え";
  float: right;
  color: #c43b4b;
  font-weight: 900;
}
.answer-result {
  display:flex;
  align-items:center;
  gap:14px;
  margin:18px 0 14px;
  padding:16px;
  border-radius:19px;
  border:2px solid;
  box-shadow:0 8px 22px rgba(45,100,125,.12);
}
.answer-result.is-correct {
  color:#126b43;
  border-color:#20b875;
  background:linear-gradient(120deg,#d8fbe9,#f2fff7);
}
.answer-result.is-wrong {
  color:#a82b3b;
  border-color:#e05262;
  background:linear-gradient(120deg,#ffe0e4,#fff5f5);
}
.answer-icon {
  flex:0 0 48px;
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:50%;
  color:white;
  font-size:30px;font-weight:1000;
  background:#16a765;
  box-shadow:0 4px 0 rgba(0,0,0,.1);
}
.is-wrong .answer-icon { background:#df4e60; }
.answer-title { font-size:22px;font-weight:1000;letter-spacing:.04em; }

// 効果音（外部音源なし・Web Audio APIで生成）
function playTones(notes){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    const now=ctx.currentTime;
    notes.forEach(([freq,start,duration,wave='sine',volume=.16])=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=wave;osc.frequency.setValueAtTime(freq,now+start);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+start);osc.stop(now+start+duration+.02);
    });
    setTimeout(()=>ctx.close(),1200);
  }catch(e){}
}

function start(type=null,val=null){currentType=type||null;currentVal=type?val:null;const pool=questions.filter(q=>!currentType||q[currentType]===currentVal);if(!pool.length){app.innerHTML=`<section class="card"><a href="#" onclick="home();return false">← ホーム</a><p>この条件の問題はまだありません。</p></section>`;return}const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};if(!currentType){const stages=[['初級',3],['中級',3],['上級',2],['Z級',2]];list=stages.flatMap(([level,count])=>shuffle(pool.filter(q=>q.level===level)).slice(0,count));if(list.length<10){const used=new Set(list);list.push(...shuffle(pool.filter(q=>!used.has(q))).slice(0,10-list.length))}}else{list=shuffle(pool).slice(0,10)}if(currentType==='member'){const levelOrder={'初級':0,'中級':1,'上級':2,'Z級':3};list.sort((a,b)=>(levelOrder[a.level]??99)-(levelOrder[b.level]??99))}list=list.map(q=>{const pairs=q.options.map((option,index)=>({option,isCorrect:index===q.correct}));shuffle(pairs);return {...q,options:pairs.map(x=>x.option),correct:pairs.findIndex(x=>x.isCorrect)}});idx=0;score=0;choice=null;answerLog=[];showQuestion()}
function showQuestion(){const q=list[idx];const categoryLabel=(currentType==='member'||currentType==='category')?currentVal:q.level;app.innerHTML=`<a class="back" href="#" onclick="home();return false">← ホーム</a><section class="card"><p class="muted">第 ${idx+1} 問 / 全 ${list.length} 問 ・ ${categoryLabel}</p><div class="question">${q.prompt}</div>${q.options.map((o,n)=>`<button class="option" ${choice!==null?'disabled':''} onclick="answer(${n})">${'ABCD'[n]}. ${o}</button>`).join('')}<div id="feedback"></div></section>`}
function answer(n){if(choice!==null)return;choice=n;const q=list[idx];const isCorrect=n===q.correct;if(isCorrect){score+=1;soundCorrect()}else{soundWrong()}answerLog.push({prompt:q.prompt,selectedText:q.options[n],correctText:q.options[q.correct],correct:isCorrect});showQuestion();const opts=document.querySelectorAll('.option');opts[q.correct].classList.add('correct-answer');opts[n].classList.add('selected');if(!isCorrect)opts[n].classList.add('wrong-answer');const feedback=document.getElementById('feedback');feedback.innerHTML=`<div class="answer-result ${isCorrect?'is-correct':'is-wrong'}"><div class="answer-icon">${isCorrect?'✓':'×'}</div><div class="answer-title">${isCorrect?'正解！':'不正解'}</div><div class="answer-detail">${isCorrect?'+1 pt':`正解は「${q.options[q.correct]}」`}</div></div><button class="primary" onclick="next()">${idx+1===list.length?'結果を見る':'次の問題へ'}</button>`}
function next(){if(idx+1===list.length){soundResult();saveHistory();app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR RESULT</div><h1>RESULT</h1><div class="big">${score} pt</div><p>${list.length}問中の結果</p><button class="primary" onclick="home()">ホームへ戻る</button><button class="primary" onclick="start(currentType,currentVal)">もう一度挑戦</button></section>`}else{idx++;choice=null;showQuestion()}}

// ボタン操作音（外部音声ファイル不要）
let buttonAudioContext = null;
document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    buttonAudioContext ||= new AudioContextClass();
    if (buttonAudioContext.state === 'suspended') buttonAudioContext.resume();

    const ctx = buttonAudioContext;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(660, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.11);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.12);
  } catch (error) {
    // 効果音が使えない環境でもクイズ本体は動作します
  }
});

home();
</script></body></html>
