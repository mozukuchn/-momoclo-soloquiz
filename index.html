const app=document.getElementById('app');let list=[],idx=0,score=0,choice=null;
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">MOMOIRO CHALLENGE</div><h1>ももクロQUIZ</h1><p>ももクロに関するクイズに挑戦！<br>ひとりで気軽に楽しもう。</p><button class="primary" onclick="start()">クイズに挑戦</button></section><section class="section"><div class="section-title">メンバー別クイズ</div><div class="grid">${['百田夏菜子 ❤️','玉井詩織 💛','佐々木彩夏 💗','高城れに 💜'].map(x=>`<button class="tile" onclick="start('member','${x.split(' ')[0]}')">${x}<small>メンバーにまつわる問題</small></button>`).join('')}</div></section><section class="section"><div class="section-title">難易度を選んで挑戦</div><div class="grid">${['初級','中級','上級','超難問'].map(x=>`<button class="tile" onclick="start('level','${x}')">${x}<small>レベルを選んで挑戦</small></button>`).join('')}</div></section>`}
function start(type,val){list=questions.filter(q=>!type||q[type]===val);if(!list.length){app.innerHTML=`<section class="card"><a href="#" onclick="home();return false">← ホーム</a><p>この条件の問題はまだありません。</p></section>`;return}idx=0;score=0;choice=null;showQuestion()}
function showQuestion(){const q=list[idx];app.innerHTML=`<a class="back" href="#" onclick="home();return false">← ホーム</a><section class="card"><p class="muted">第 ${idx+1} 問 / 全 ${list.length} 問 ・ ${q.level}</p><div class="question">${q.prompt}</div>${q.options.map((o,n)=>`<button class="option" ${choice!==null?'disabled':''} onclick="answer(${n})">${'ABCD'[n]}. ${o}</button>`).join('')}<div id="feedback"></div></section>`}
function answer(n){if(choice!==null)return;choice=n;const q=list[idx];if(n===q.correct)score+=100;showQuestion();document.querySelectorAll('.option')[n].classList.add('selected');document.getElementById('feedback').innerHTML=`<p class="notice">${n===q.correct?'正解！ +100 pt':'残念！ 正解は '+q.options[q.correct]}</p><button class="primary" onclick="next()">${idx+1===list.length?'結果を見る':'次の問題へ'}</button>`}
function next(){if(idx+1===list.length){app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR RESULT</div><h1>RESULT</h1><div class="big">${score} pt</div><p>${list.length}問中の結果</p><button class="primary" onclick="home()">ホームへ戻る</button><button class="primary" onclick="start()">もう一度挑戦</button></section>`}else{idx++;choice=null;showQuestion()}}
home();
</script></body></html>
